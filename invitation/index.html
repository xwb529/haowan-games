<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>电子请柬生成器 · 无水印</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--page:#f4f1ec;--card:#fff;--ink:#2b2620;--mut:#8a8175;--line:#e7e0d2;--brand:#a52a1e;--brand2:#7e1c11;--gold:#b98a2f}
html,body{background:var(--page);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit}
.hidden{display:none!important}
.serif{font-family:"Songti SC","STSong","Noto Serif CJK SC","Noto Serif SC","SimSun",serif}

/* ---------- 生成器 ---------- */
.gen-wrap{max-width:1080px;margin:0 auto;padding:22px 16px 60px}
.gen-head{text-align:center;padding:16px 0 22px}
.gen-head h1{font-size:32px;letter-spacing:4px;font-weight:700}
.gen-head .rule{width:120px;height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:12px auto 0}
.gen-head p{color:var(--mut);margin-top:10px;font-size:14px;line-height:1.7}
.gen-head .tag{display:inline-block;background:#fbe9e7;color:var(--brand);border:1px solid #f0c8c2;border-radius:999px;padding:3px 12px;font-size:12px;margin:0 3px}
.gen-grid{display:grid;grid-template-columns:1fr 380px;gap:22px;align-items:start}
@media(max-width:860px){.gen-grid{grid-template-columns:1fr}}
@media(min-width:861px){.panel-preview{position:sticky;top:16px}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:0 6px 22px rgba(90,70,30,.05)}
.panel h2{font-size:16px;margin-bottom:14px;letter-spacing:1px}
.f-row{margin-bottom:14px}
.f-row label{display:block;font-size:13px;color:var(--mut);margin-bottom:6px}
.f-row label b{color:var(--brand);font-weight:600}
.f-row input[type=text],.f-row input[type=date],.f-row input[type=time],.f-row input[type=tel],.f-row textarea{
  width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:15px;background:#fff;color:var(--ink);outline:none}
.f-row input:focus,.f-row textarea:focus{border-color:var(--brand)}
.f-row textarea{resize:vertical;min-height:56px;line-height:1.6}
.f-row .err{border-color:#d43d2a!important;background:#fff6f4}
.f-2col{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chip-row{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font-size:14px;color:var(--ink)}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
/* 风格缩略卡（G1） */
.style-cards{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.style-card{border:1.5px solid var(--line);border-radius:12px;overflow:hidden;background:#fff;padding:0;text-align:left;transition:border-color .15s, box-shadow .15s}
.style-card .sc-thumb{height:76px;background-size:cover;background-position:center 22%;border-bottom:1px solid var(--line)}
.style-card .sc-meta{display:flex;align-items:center;justify-content:space-between;padding:8px 11px}
.style-card .sc-name{font-size:14px;color:var(--ink)}
.style-card .sc-dots i{width:12px;height:12px;border-radius:50%;display:inline-block;margin-left:4px;border:1px solid rgba(0,0,0,.10);vertical-align:-1px}
.style-card.on{border-color:var(--brand);box-shadow:0 0 0 3px rgba(165,42,30,.14)}
.switch-row{display:flex;align-items:center;justify-content:space-between;border:1px dashed var(--line);border-radius:10px;padding:10px 12px}
.switch-row span{font-size:14px}
.switch-row small{display:block;color:var(--mut);font-size:12px;margin-top:2px}
.switch{position:relative;width:46px;height:26px;flex:none}
.switch input{opacity:0;width:100%;height:100%;position:absolute;margin:0;cursor:pointer;z-index:2}
.switch i{position:absolute;inset:0;background:#d8d2c4;border-radius:999px;transition:.2s}
.switch i:after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
.switch input:checked + i{background:var(--brand)}
.switch input:checked + i:after{left:23px}
.err-msg{display:none;background:#fdeceb;color:#b3261a;border:1px solid #f3c1bb;border-radius:10px;padding:10px 12px;font-size:13px;line-height:1.6;margin-bottom:14px}
.err-msg.show{display:block}
.btn{display:block;width:100%;border:none;border-radius:12px;padding:13px;font-size:16px;letter-spacing:1px}
.btn-main{background:var(--brand);color:#fff}
.btn-main:active{background:var(--brand2)}
.btn-sub{background:#fff;border:1px solid var(--brand);color:var(--brand);margin-top:10px}
.link-out{display:none;margin-top:14px}
.link-out.show{display:block}
.link-out textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:12px;word-break:break-all;background:#fbf9f4;min-height:64px;resize:none}
.toast{position:fixed;left:50%;bottom:34px;transform:translateX(-50%) translateY(20px);background:rgba(30,25,20,.92);color:#fff;padding:10px 20px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:99}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.pv-note{text-align:center;color:var(--mut);font-size:12px;margin-top:10px}

/* ---------- 请柬本体（预览与展示共用） ---------- */
.phone{width:340px;max-width:92vw;margin:0 auto;border:10px solid #26221d;border-radius:38px;overflow:hidden;box-shadow:0 14px 34px rgba(60,45,20,.18);background:#fff}
.invite{--bg:#fff;--soft:#f7f3ea;--ink:#33302a;--accent:#a52a1e;--deep:#7e1c11;--gold:#b98a2f;--veil:rgba(255,255,255,.55);--wash:transparent;--onimg:#7e1c11;
  background:var(--bg);color:var(--ink);position:relative;text-align:center;display:flex;flex-direction:column}
/* 装饰头图区（V1/V2） */
.inv-hero{position:relative;height:300px;flex:none;background-size:cover;background-position:center top;overflow:hidden}
.inv-hero:before{content:"";position:absolute;inset:0;background:var(--wash)}
.inv-hero-in{position:absolute;left:0;right:0;bottom:0;padding:34px 18px 16px;background:linear-gradient(180deg,transparent,var(--veil) 62%);text-align:center}
.inv-seal-wrap{position:absolute;top:14px;left:0;right:0;text-align:center;z-index:2}
.inv-seal{display:inline-block;background:var(--accent);color:#fff7e6;font-family:"Songti SC","STSong","Noto Serif CJK SC",serif;font-size:15px;letter-spacing:3px;padding:6px 9px 6px 12px;border-radius:5px;box-shadow:0 3px 10px rgba(60,20,0,.25);transform:rotate(-3deg)}
.invite[data-dark="1"] .inv-seal{background:var(--gold);color:#5e130b}
.inv-tag{display:inline-block;border:1px solid var(--accent);color:var(--accent);background:rgba(255,255,255,.78);font-size:12px;letter-spacing:4px;padding:5px 12px 5px 16px;border-radius:999px}
.inv-ctitle{font-family:"Songti SC","STSong","Noto Serif CJK SC",serif;font-size:19px;font-weight:700;letter-spacing:2px;color:var(--onimg);line-height:1.45;word-break:break-all}
.inv-hosts{font-family:"Songti SC","STSong","Noto Serif CJK SC",serif;font-size:31px;font-weight:800;letter-spacing:3px;color:var(--onimg);line-height:1.35;word-break:break-all;margin-top:2px}
.inv-amp{color:var(--accent);font-size:21px;padding:0 4px}
.inv-herosub{margin-top:7px;font-size:12px;letter-spacing:7px;color:var(--onimg);opacity:.85}
/* 正文区 */
.inv-body{padding:20px 22px 24px;display:flex;flex-direction:column;flex:1}
.inv-msg{font-family:"Songti SC","STSong","Noto Serif CJK SC",serif;font-size:14.5px;line-height:2;color:var(--ink);white-space:pre-wrap;word-break:break-all;padding:0 6px}
.inv-div{display:block;margin:16px auto 4px;color:var(--gold)}
/* 日期焦点卡（V6） */
.inv-datecard{display:flex;align-items:center;justify-content:center;gap:18px;margin-top:12px;padding:15px 6px;border-top:1.5px solid var(--gold);border-bottom:1.5px solid var(--gold);position:relative}
.inv-datecard:before{content:"";position:absolute;left:0;right:0;top:3px;border-top:.5px solid var(--gold);opacity:.6}
.inv-datecard:after{content:"";position:absolute;left:0;right:0;bottom:3px;border-bottom:.5px solid var(--gold);opacity:.6}
.inv-day{font-family:"Songti SC","STSong","Noto Serif CJK SC",serif;font-size:58px;font-weight:800;line-height:1;color:var(--deep)}
.inv-dmeta{text-align:left}
.inv-ym{font-size:15px;font-weight:700;color:var(--deep);letter-spacing:1px}
.inv-time{font-family:"Songti SC","STSong","Noto Serif CJK SC",serif;font-size:24px;font-weight:700;color:var(--ink);margin-top:3px}
.inv-time small{font-size:12px;color:var(--accent);letter-spacing:2px;margin-left:6px}
.inv-rows{margin-top:16px}
.inv-row{display:flex;gap:12px;align-items:baseline;justify-content:center;padding:6px 2px;font-size:15px;line-height:1.65;word-break:break-all}
.inv-row .k{flex:none;color:var(--accent);font-size:12px;letter-spacing:3px;border:1px solid var(--gold);border-radius:4px;padding:1px 6px 1px 9px}
.inv-actions{margin:20px 0 0;display:flex;gap:10px}
.inv-actions a,.inv-actions button{flex:1;text-decoration:none;border-radius:999px;padding:12px 0;font-size:14px;letter-spacing:1px;box-shadow:0 5px 14px rgba(90,60,10,.13)}
.inv-call{background:var(--accent);color:#fff;border:none}
.inv-copy{background:rgba(255,255,255,.85);color:var(--accent);border:1px solid var(--accent);box-shadow:none}
.inv-credit{margin-top:16px;font-size:11px;color:#b9b0a0;letter-spacing:1px}
.inv-foot{margin-top:12px;color:var(--gold)}

/* ---------- 展示模式 ---------- */
.show-wrap{min-height:100vh;display:flex;flex-direction:column}
.show-wrap .invite{flex:1;width:100%;max-width:520px;margin:0 auto;min-height:100vh;box-shadow:0 0 40px rgba(60,45,20,.12)}
.show-wrap .inv-hero{height:min(430px,50vh)}
.show-wrap .inv-hosts{font-size:39px}
.show-wrap .inv-ctitle{font-size:22px}
.show-wrap .inv-msg{font-size:15.5px}
.show-wrap .inv-day{font-size:66px}
.show-wrap .inv-body{padding-bottom:30px}
.show-wrap .inv-foot{margin-top:auto;padding-top:14px}
.show-bad{max-width:420px;margin:80px auto;background:#fff;border:1px solid var(--line);border-radius:16px;padding:30px 24px;text-align:center;line-height:2}
.show-bad a{color:var(--brand)}
</style>
</head>
<body>

<!-- ================= 生成器模式 ================= -->
<div id="genView" class="gen-wrap">
  <div class="gen-head">
    <h1 class="serif">电子请柬生成器</h1>
    <div class="rule"></div>
    <p>填好信息，一键生成请柬链接和海报图，发到微信就能打开。<br>
    <span class="tag">无水印</span><span class="tag">无限次生成</span><span class="tag">5 大场景 · 10 套模板</span></p>
  </div>
  <div class="gen-grid">
    <div class="panel">
      <h2>① 填写请柬信息</h2>
      <div class="f-row"><label>场景</label><div class="chip-row" id="sceneChips"></div></div>
      <div class="f-row"><label>风格（点卡片预览效果）</label><div class="style-cards" id="styleCards"></div></div>
      <div class="f-row"><label>请柬标题（可不填，不填只显示主人姓名）</label>
        <input type="text" id="fTitle" maxlength="30" placeholder="如：我们的婚礼 · 诚邀您见证"></div>
      <div class="f-row"><label>主人姓名 <b>*必填</b>（第二位可不填）</label>
        <div class="f-2col">
          <input type="text" id="fHost1" maxlength="12" placeholder="主人一，如：张伟">
          <input type="text" id="fHost2" maxlength="12" placeholder="主人二，如：李娜">
        </div></div>
      <div class="f-row"><div class="f-2col">
        <div><label>日期 <b>*必填</b></label><input type="date" id="fDate"></div>
        <div><label>时间 <b>*必填</b></label><input type="time" id="fTime"></div>
      </div></div>
      <div class="f-row"><label>地点名称 <b>*必填</b></label>
        <input type="text" id="fVenue" maxlength="30" placeholder="如：香格里拉大酒店 2F 宴会厅"></div>
      <div class="f-row"><label>详细地址 <b>*必填</b></label>
        <input type="text" id="fAddr" maxlength="60" placeholder="如：长春市南关区人民大街 123 号"></div>
      <div class="f-row"><label>联系电话 <b>*必填</b>（宾客可一键拨打）</label>
        <input type="tel" id="fPhone" maxlength="15" placeholder="如：138 0000 0000"></div>
      <div class="f-row"><label>欢迎语（可不填，用场景默认文案）</label>
        <textarea id="fMsg" maxlength="120" placeholder="一句话邀请语"></textarea>
        <div class="chip-row" id="msgChips" style="margin-top:8px"></div></div>
      <div class="f-row"><div class="switch-row">
        <span>显示制作署名<small>请柬底部一行淡字「用同款生成器制作」，关掉则完全不显示</small></span>
        <label class="switch"><input type="checkbox" id="fCredit" checked><i></i></label>
      </div></div>
      <div class="err-msg" id="errMsg"></div>
      <h2 style="margin-top:20px">② 生成与分享</h2>
      <button class="btn btn-main" id="btnLink">生成请柬链接</button>
      <div class="link-out" id="linkOut">
        <textarea id="linkText" readonly></textarea>
        <button class="btn btn-sub" id="btnCopy">复制链接</button>
      </div>
      <button class="btn btn-sub" id="btnPoster" style="margin-top:14px">生成海报图（可保存 / 分享）</button>
      <p style="color:var(--mut);font-size:12px;line-height:1.7;margin-top:12px">小提示：链接里包含你填写的全部信息，请核对无误后再发给宾客；改了信息重新生成一条新链接即可。</p>
    </div>
    <div class="panel panel-preview">
      <h2>实时预览</h2>
      <div class="phone"><div id="preview"></div></div>
      <p class="pv-note">预览为示意效果，宾客打开链接看到的就是这个样子</p>
    </div>
  </div>
</div>

<!-- ================= 请柬展示模式 ================= -->
<div id="showView" class="show-wrap hidden"></div>

<div class="toast" id="toast"></div>

<script>

/* ---------- payload 编解码：JSON -> UTF-8 -> base64url ---------- */
function enc(obj){
  const bytes = new TextEncoder().encode(JSON.stringify(obj));
  let bin = '';
  bytes.forEach(b => { bin += String.fromCharCode(b); });
  return btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function dec(str){
  let s = String(str).replace(/-/g,'+').replace(/_/g,'/');
  while (s.length % 4) s += '=';
  const bin = atob(s);
  const bytes = new Uint8Array(bin.length);
  for (let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
  return JSON.parse(new TextDecoder().decode(bytes));
}

/* ---------- 工具函数 ---------- */
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
/* F1 修复：构造 Date 后回验年月日，溢出滚动的非法日期返回 null */
function parseDateParts(dateStr){
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(dateStr||'');
  if(!m) return null;
  const y = +m[1], mo = +m[2], d = +m[3];
  const dt = new Date(y, mo-1, d);
  if (isNaN(dt.getTime()) || dt.getFullYear()!==y || dt.getMonth()!==mo-1 || dt.getDate()!==d) return null;
  return { y:y, m:mo, d:d, wd:'星期' + '日一二三四五六'[dt.getDay()] };
}
function weekdayOf(dateStr){
  const p = parseDateParts(dateStr);
  return p ? p.wd : '';
}
function fmtDate(dateStr){
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(dateStr||'');
  if(!m) return dateStr||'';
  return (+m[1]) + ' 年 ' + (+m[2]) + ' 月 ' + (+m[3]) + ' 日';
}
function rr(ctx,x,y,w,h,r){
  r = Math.min(r, w/2, h/2);
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}
let toastTimer = null;
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 2200);
}
function copyText(text, okMsg){
  function done(){ toast(okMsg || '已复制'); }
  function legacy(){
    try{
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
      document.body.appendChild(ta); ta.focus(); ta.select();
      const ok = document.execCommand('copy');
      document.body.removeChild(ta);
      if (ok) done(); else toast('复制失败，请长按手动复制');
    }catch(e){ toast('复制失败，请长按手动复制'); }
  }
  if (navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(text).then(done).catch(legacy);
  } else legacy();
}

/* ---------- 海报图 ---------- */
function wrapLines(ctx, text, maxW){
  const lines = []; let cur = '';
  for (const ch of String(text)){
    if (ctx.measureText(cur + ch).width > maxW && cur){ lines.push(cur); cur = ch; }
    else cur += ch;
  }
  if (cur) lines.push(cur);
  return lines.length ? lines : [''];
}
/* F3 修复：字号自适应——先缩字号再截断，截断带省略号不静默丢字 */
function fitFont(ctx, text, maxW, base, min, weight, family){
  let s = base;
  ctx.font = weight + ' ' + s + 'px ' + family;
  while (ctx.measureText(text).width > maxW && s > min){ s -= 2; ctx.font = weight + ' ' + s + 'px ' + family; }
  return s;
}
function wrapFit(ctx, text, maxW, maxLines, base, min, weight, family){
  let s = base, lines = [];
  while (s >= min){
    ctx.font = weight + ' ' + s + 'px ' + family;
    lines = wrapLines(ctx, text, maxW);
    if (lines.length <= maxLines) return { size:s, lines:lines };
    s -= 2;
  }
  ctx.font = weight + ' ' + min + 'px ' + family;
  lines = wrapLines(ctx, text, maxW);
  if (lines.length > maxLines){
    lines = lines.slice(0, maxLines);
    let last = lines[maxLines-1];
    while (last && ctx.measureText(last + '…').width > maxW) last = last.slice(0,-1);
    lines[maxLines-1] = last + '…';
  }
  return { size:min, lines:lines };
}
const SERIF_F = '"Songti SC","STSong","Noto Serif CJK SC",serif';
const SANS_F = '"PingFang SC","Microsoft YaHei",sans-serif';
function drawPoster(p){
  const st = styleOf(p);
  const img = new Image();
  img.onload = () => renderPoster(p, img);
  img.onerror = () => renderPoster(p, null);
  img.src = DECO[st.img];
}
function renderPoster(p, decoImg){
  const sc = SCENES[p.scene]; const st = styleOf(p);
  const W = 900, H = 1350;
  const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
  const ctx = cv.getContext('2d');
  ctx.fillStyle = st.bg; ctx.fillRect(0,0,W,H);
  if (decoImg){
    const s = Math.max(W/decoImg.naturalWidth, H/decoImg.naturalHeight);
    const dw = decoImg.naturalWidth*s, dh = decoImg.naturalHeight*s;
    ctx.drawImage(decoImg, (W-dw)/2, (H-dh)/2, dw, dh);
  } else {
    ctx.strokeStyle = st.gold; ctx.lineWidth = 4; rr(ctx,36,36,W-72,H-72,24); ctx.stroke();
    ctx.lineWidth = 1.5; rr(ctx,54,54,W-108,H-108,18); ctx.stroke();
  }
  const dark = st.dark;
  const inkMain = dark ? '#f9edd2' : st.deep;
  const inkBody = dark ? '#f3e3c2' : st.ink;
  const inkSub  = dark ? '#e2c88f' : '#8a8175';
  const acc     = dark ? '#e9b949' : st.accent;
  ctx.textAlign = 'center';
  /* 印章 */
  ctx.fillStyle = acc; rr(ctx, W/2-56, 262, 112, 54, 9); ctx.fill();
  ctx.fillStyle = dark ? '#5e130b' : '#ffffff';
  ctx.font = '700 27px ' + SERIF_F;
  ctx.fillText(sc.seal.split('').join(' '), W/2, 299);
  /* 标题行：自定义标题优先，否则用后缀 */
  const ct = customTitle(p);
  ctx.fillStyle = acc; ctx.font = '600 31px ' + SERIF_F;
  ctx.fillText(ct || sc.suffix, W/2, 384);
  /* 主人名：字号自适应 */
  const hostsLine = p.hosts.join('  ' + (sc.joiner.trim()||' ') + '  ');
  ctx.fillStyle = inkMain;
  if (dark){ ctx.shadowColor = 'rgba(60,0,0,.4)'; ctx.shadowBlur = 8; }
  fitFont(ctx, hostsLine, W-170, 84, 42, '800', SERIF_F);
  ctx.fillText(hostsLine, W/2, 492);
  ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0;
  /* 分隔：线—菱—线 */
  ctx.strokeStyle = acc; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(W/2-150, 542); ctx.lineTo(W/2-22, 542); ctx.moveTo(W/2+22, 542); ctx.lineTo(W/2+150, 542); ctx.stroke();
  ctx.save(); ctx.translate(W/2, 542); ctx.rotate(Math.PI/4); ctx.fillStyle = acc; ctx.fillRect(-6,-6,12,12); ctx.restore();
  /* 欢迎语 */
  const msg = p.msg || sc.msgs[0];
  const mw = wrapFit(ctx, msg, W-250, 4, 30, 23, '400', SANS_F);
  ctx.fillStyle = inkBody; ctx.font = '400 ' + mw.size + 'px ' + SANS_F;
  mw.lines.forEach((ln,i)=>ctx.fillText(ln, W/2, 606 + i*46));
  /* 日期焦点 */
  const dp = parseDateParts(p.date);
  ctx.fillStyle = inkMain;
  fitFont(ctx, dp ? (dp.y + ' 年 ' + dp.m + ' 月 ' + dp.d + ' 日') : fmtDate(p.date), W-200, 54, 34, '700', SERIF_F);
  ctx.fillText(dp ? (dp.y + ' 年 ' + dp.m + ' 月 ' + dp.d + ' 日') : fmtDate(p.date), W/2, 838);
  ctx.fillStyle = acc; ctx.font = '600 33px ' + SANS_F;
  ctx.fillText((dp ? dp.wd + ' · ' : '') + (p.time||''), W/2, 894);
  /* 地点 / 地址 */
  ctx.fillStyle = inkBody;
  fitFont(ctx, p.venue, W-220, 36, 25, '600', SANS_F);
  ctx.fillText(p.venue, W/2, 972);
  const aw = wrapFit(ctx, p.address, W-260, 2, 28, 21, '400', SANS_F);
  ctx.fillStyle = inkSub; ctx.font = '400 ' + aw.size + 'px ' + SANS_F;
  aw.lines.forEach((ln,i)=>ctx.fillText(ln, W/2, 1022 + i*40));
  /* 落款 */
  ctx.fillStyle = acc; ctx.font = '600 29px ' + SERIF_F;
  ctx.fillText('诚 挚 邀 请 · 恭 候 光 临', W/2, 1252);
  cv.toBlob(function(blob){
    if (!blob){ toast('海报生成失败，请重试'); return; }
    const url = URL.createObjectURL(blob);
    const fileName = '请柬海报-' + (p.hosts.join('') || '邀请') + '.png';
    const file = (window.File && blob) ? new File([blob], fileName, {type:'image/png'}) : null;
    if (file && navigator.canShare && navigator.canShare({files:[file]})){
      navigator.share({files:[file]}).catch(()=>saveBlob(url, fileName));
    } else saveBlob(url, fileName);
  }, 'image/png');
}
function saveBlob(url, name){
  const a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 4000);
  toast('海报已保存，去相册看看');
}

  if (!sc){ sv.innerHTML = '<div class="show-bad">这条请柬链接不完整。<br><a href="' + SITE + '">去做一张自己的请柬 →</a></div>'; return; }
  document.title = (customTitle(p) || ((p.hosts||[]).join(' ') + ' ' + sc.suffix));
  sv.innerHTML = inviteHTML(p);
}

/* ---------- 入口 ---------- */
(function(){
  const m = /#i=([A-Za-z0-9\-_]+)/.exec(location.hash || '');
  if (m){
    try { initShow(dec(m[1])); return; }
    catch(e){
      document.getElementById('genView').classList.add('hidden');
      const sv = document.getElementById('showView');
      sv.classList.remove('hidden');
      sv.innerHTML = '<div class="show-bad">这条请柬链接打开失败，可能复制时漏了字符。<br><a href="' + SITE + '">去做一张自己的请柬 →</a></div>';
      return;
    }
  }
  initGen();
})();
</script>
