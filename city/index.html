<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>你的本命定居城市 · 12城定居匹配测试</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--ink:#33291F;--ink2:#5C4B40;--sub:#9A8468;--line:#E9DcC4;--accent:#BC5F1D;--accent2:#D97B33;--bg:#FBF3E1;--card:#FFFDF7;
--sh:0 12px 32px rgba(122,84,38,.10),0 2px 8px rgba(122,84,38,.06);--sh-sm:0 4px 14px rgba(122,84,38,.10)}
body{font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;color:var(--ink);min-height:100vh;
background:radial-gradient(720px 340px at 85% -60px,rgba(217,123,51,.14),transparent 70%),radial-gradient(640px 300px at -10% 30%,rgba(91,140,90,.10),transparent 70%),linear-gradient(180deg,#FCF4E3,#F8ECD2);background-attachment:fixed}
.serif{font-family:Georgia,"Songti SC","STSong","SimSun",serif}
.wrap{max-width:560px;margin:0 auto;padding:18px 16px 52px}
#app>*{animation:fadeUp .45s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.kicker{color:var(--accent);letter-spacing:.38em;font-size:12.5px;font-weight:600;text-align:center}
.hero{text-align:center;padding:16px 4px 4px}
.hero h1{font-size:41px;line-height:1.28;font-weight:800;margin-top:12px}
.hero .sub{color:var(--sub);margin-top:13px;font-size:14.5px;line-height:1.75}
.cover{margin:20px 0 4px;border-radius:20px;overflow:hidden;box-shadow:var(--sh);border:1px solid rgba(190,158,105,.35)}
.cover img{width:100%;display:block}
.cities-cloud{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:18px 0 4px}
.chip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 13px 5px 6px;font-size:13.5px;box-shadow:var(--sh-sm)}
.chip img{width:24px;height:24px;border-radius:50%;object-fit:cover}
.btn{display:block;width:100%;border:none;border-radius:16px;padding:16px;font-size:17px;font-weight:600;cursor:pointer;text-align:center;transition:transform .12s ease,box-shadow .2s}
.btn:active{transform:scale(.985)}
.btn-main{background:linear-gradient(135deg,var(--accent2),var(--accent));color:#fff;box-shadow:0 10px 24px rgba(188,95,29,.35)}
.btn-ghost{background:var(--card);color:var(--ink);border:1px solid var(--line);margin-top:10px;box-shadow:var(--sh-sm)}
.btn-small{padding:12px;font-size:15px;border-radius:12px}
.howto{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:17px 19px;margin:18px 0;line-height:1.95;font-size:14.5px;color:var(--ink2);box-shadow:var(--sh)}
.howto b{color:var(--accent)}
.banner{background:linear-gradient(135deg,#FDF0DA,#FBE7C6);border:1px solid #EFD3A0;border-radius:16px;padding:14px 16px;font-size:14.5px;line-height:1.7;margin-bottom:14px;text-align:center;box-shadow:var(--sh-sm)}
.prog{display:flex;align-items:center;gap:10px;margin:10px 0 16px;font-size:13px;color:var(--sub)}
.bar{flex:1;height:9px;background:#EFE2C8;border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent2),var(--accent));border-radius:99px;transition:width .45s ease}
.chap{text-align:center;padding:26px 4px;min-height:calc(100vh - 150px);display:flex;flex-direction:column;justify-content:center}
.chap-art{border-radius:18px;overflow:hidden;box-shadow:var(--sh);margin-bottom:26px;border:1px solid rgba(190,158,105,.35)}
.chap .dots,.chap .kicker,.chap h2,.chap p{flex:none}
.chap .btn{flex:none}
.chap-art img{width:100%;display:block}
.dots{display:flex;gap:8px;justify-content:center;margin-bottom:18px}
.dots i{width:8px;height:8px;border-radius:50%;background:#E3D2AE}
.dots i.on{background:var(--accent)}
.chap h2{font-size:31px;margin:12px 0 12px;font-weight:800}
.chap p{color:var(--sub);line-height:1.85;font-size:15px;max-width:400px;margin:0 auto 26px}
.chap .rule{width:54px;height:3px;border-radius:99px;background:var(--accent);opacity:.55;margin:18px auto 0}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:24px 20px 14px;box-shadow:var(--sh)}
.qcard .qno{color:var(--accent);font-size:12.5px;letter-spacing:.22em;font-weight:600;margin-bottom:10px}
.qcard h3{font-size:21px;line-height:1.55;margin-bottom:20px;font-weight:700}
.opt{display:flex;align-items:center;gap:11px;width:100%;text-align:left;background:#FBF3E0;border:1.5px solid var(--line);border-radius:15px;padding:14px 15px;font-size:15.5px;line-height:1.55;margin-bottom:11px;cursor:pointer;color:var(--ink);transition:border-color .15s,background .15s,transform .1s}
.opt:active{transform:scale(.99)}
.opt .k{flex:none;display:inline-flex;align-items:center;justify-content:center;width:27px;height:27px;border-radius:50%;background:#F1DFBA;color:#A05A1B;font-size:14px;font-weight:700}
.opt.sel{border-color:var(--accent);background:#FBEED3}
.opt.sel .k{background:var(--accent);color:#fff}
.backbtn{background:none;border:none;color:var(--sub);font-size:14px;cursor:pointer;padding:10px 2px}
.res-hero{position:relative;border-radius:22px;overflow:hidden;margin-bottom:16px;box-shadow:var(--sh);color:#fff}
.res-hero img.ph{width:100%;height:218px;object-fit:cover;object-position:center;display:block}
.res-hero .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(24,16,8,.30) 0,rgba(24,16,8,.05) 42%,rgba(24,16,8,.70))}
.res-hero .inner{position:absolute;left:0;right:0;bottom:0;padding:16px 20px 18px}
.res-hero .lab{font-size:13px;letter-spacing:.14em;opacity:.92}
.res-hero h2{font-size:37px;margin:3px 0 2px;font-weight:800;text-shadow:0 2px 10px rgba(0,0,0,.25)}
.res-hero .tag{font-size:15.5px;opacity:.96}
.res-hero .pct{position:absolute;top:14px;right:14px;background:rgba(255,253,247,.92);color:var(--accent);padding:6px 14px;border-radius:999px;font-size:14.5px;font-weight:700;box-shadow:var(--sh-sm)}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;margin-bottom:14px;box-shadow:var(--sh)}
.card h4{display:flex;align-items:center;gap:9px;font-size:15.5px;margin-bottom:13px;color:var(--ink)}
.card h4::before{content:'';flex:none;width:8px;height:8px;border-radius:50%;background:var(--accent)}
.card p,.card li{font-size:15px;line-height:1.85;color:var(--ink2)}
.card ul{padding-left:20px}
.kw{display:flex;gap:8px;flex-wrap:wrap}
.kw span{background:#FAEED3;border:1px solid #F0DCB2;border-radius:999px;padding:6px 14px;font-size:14px;color:#7A5326}
.dim{margin-bottom:13px}
.dim .lab{display:flex;justify-content:space-between;font-size:14px;margin-bottom:6px;color:var(--ink2)}
.dim .lab b{color:var(--ink)}
.dim .tr{height:9px;background:#F0E4C9;border-radius:99px;overflow:hidden}
.dim .fl{height:100%;border-radius:99px;transition:width .9s cubic-bezier(.22,.8,.3,1)}
.partner{display:flex;gap:14px;align-items:center}
.partner img{width:76px;height:76px;border-radius:14px;object-fit:cover;flex:none;box-shadow:var(--sh-sm)}
.partner .pn{font-size:17px;font-weight:700}
.top3{display:flex;gap:10px}
.top3 .t3{flex:1;text-align:center;background:#FBF3E0;border:1px solid var(--line);border-radius:15px;padding:8px 6px 11px}
.top3 .t3 img{width:100%;height:62px;object-fit:cover;border-radius:10px;display:block}
.top3 .t3 .n{font-weight:600;margin-top:8px;font-size:15px}
.top3 .t3 .s{color:var(--sub);font-size:12.5px;margin-top:2px}
.warn{background:linear-gradient(135deg,#FBEEE0,#F9E4CC);border:1px dashed #DFA964;border-radius:16px;padding:15px 17px;font-size:14.5px;line-height:1.8;color:#7A5326;margin-bottom:14px}
.linkbox{background:#F7EFDB;border:1px solid var(--line);border-radius:12px;padding:12px;font-size:13px;word-break:break-all;line-height:1.6;margin:10px 0}
.dual-vs{position:relative;display:flex;gap:12px;margin-bottom:14px}
.dual-vs .side{flex:1;border-radius:20px;overflow:hidden;background:var(--card);border:1px solid var(--line);box-shadow:var(--sh);text-align:center}
.dual-vs .side img{width:100%;height:102px;object-fit:cover;display:block}
.dual-vs .side .bd{padding:12px 8px 16px}
.dual-vs .side .n{font-size:23px;font-weight:800}
.dual-vs .side .r{font-size:12.5px;color:var(--sub);margin-top:4px;line-height:1.5}
.vs{position:absolute;left:50%;top:76px;transform:translateX(-50%);z-index:2;width:40px;height:40px;border-radius:50%;background:#FFFDF7;box-shadow:var(--sh);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;color:var(--accent);border:1px solid var(--line)}
.dual-idx{text-align:center;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:24px 20px;margin-bottom:14px;box-shadow:var(--sh)}
.dual-idx .num{font-size:54px;font-weight:800;color:var(--accent);line-height:1.1}
.dual-idx .lab{color:var(--sub);font-size:14px;margin-top:2px;letter-spacing:.3em}
.dual-idx .cmt{margin-top:13px;font-size:15.5px;line-height:1.8;color:var(--ink2)}
.modal{position:fixed;inset:0;background:rgba(40,28,18,.74);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal .box{background:var(--bg);border-radius:22px;padding:18px;max-width:440px;width:100%;text-align:center;max-height:92vh;overflow:auto;box-shadow:0 24px 60px rgba(0,0,0,.35)}
.modal canvas{width:100%;height:auto;border-radius:14px;box-shadow:0 8px 28px rgba(0,0,0,.22)}
.foot{text-align:center;color:#BBA888;font-size:12.5px;margin-top:28px;line-height:1.8;letter-spacing:.06em}
</style>
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<div class="modal" id="cardModal" style="display:none">
  <div class="box">
    <canvas id="cardCv" width="750" height="1000"></canvas>
    <button class="btn btn-main btn-small" style="margin-top:14px" onclick="saveCard()">保存图片到相册</button>
    <button class="btn btn-ghost btn-small" onclick="shareCard()">分享给朋友</button>
    <button class="btn btn-ghost btn-small" onclick="closeCard()">关闭</button>
    <p style="color:var(--sub);font-size:12.5px;margin-top:10px">保存后图片在下载/相册里；iPhone 可长按图片保存</p>
  </div>
</div>

(function preload(){ const h = new Image(); h.src = IMGS.hero; IMG_EL.hero = h; IMGS.cities.forEach(u=>{ const im = new Image(); im.src = u; IMG_EL.cities.push(im); }); })();
function cityImg(i, cls){ return '<img class="'+(cls||'')+'" src="'+IMGS.cities[i]+'" alt="">'; }
function b64e(o){return btoa(JSON.stringify(o)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');}
function b64d(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';return JSON.parse(atob(s));}
const app = document.getElementById('app');
let S = {qi:0, ans:[], invite:null, my:null, dualCtx:null, cardMode:'single', cardDual:null};

function esc(t){return String(t);}
function chapterOf(qi){return Math.floor(qi/6);}

function compute(ans){
  const sc = new Array(12).fill(0);
  ans.forEach((oi,qi)=>{ if(oi==null) return; QS[qi].opts[oi].c.forEach(c=>sc[c]++); });
  const order = sc.map((v,i)=>i).sort((a,b)=> sc[b]-sc[a] || a-b);
  const top = order[0], second = order[1];
  const diff = sc[top]-sc[second];
  const pct = Math.max(78, Math.min(98, 78 + diff*4));
  return {scores:sc, order:order, top:top, pct:pct};
}

  if(S.invite){
    const inv = CITIES[S.invite.t];
    banner = '<div class="banner">有位朋友测出自己的本命城市是 <b>'+inv.name+'</b>，<br>邀请你也来测一次，看看你俩是不是<b>同城的命</b>。</div>';
  }
  const chips = CITIES.map((c,i)=>'<span class="chip"><img src="'+IMGS.cities[i]+'" alt="">'+c.name+'</span>').join('');
  app.innerHTML =
   banner +
   '<div class="hero"><div class="kicker">定 居 匹 配 测 试</div>' +
   '<h1 class="serif">你的本命<br>定居城市</h1>' +
   '<p class="sub">24 道生活情景题，4 篇章节<br>从气候、节奏、吃喝到安家算账<br>测出最适合你长期住下去的那座城</p></div>' +
   '<div class="cover"><img src="'+IMGS.hero+'" alt="十二城水彩拼贴"></div>' +
   '<div class="cities-cloud">'+chips+'</div>' +
   '<div class="howto"><b>玩法说明</b><br>· 全程凭第一直觉选，没有对错<br>· 约 3 分钟测完，可返回上一题修改<br>· 结果含契合度、四维画像和另外 3 座候选城市<br>· 测完可生成<b>专属邀请链接</b>发给朋友，TA 测完直接出你俩的<b>同城报告</b></div>' +
   '<button class="btn btn-main" onclick="start()">开始测试</button>' +
   '<div class="foot">12 座城市 · 24 道题 · 仅供娱乐和自我探索参考</div>';
  window.scrollTo(0,0);
}
function start(){ S.qi = 0; S.ans = []; showChapter(0); }
function showChapter(ci){
  const ch = CHAPS[ci];
  const dots = CHAPS.map((_,i)=>'<i class="'+(i<=ci?'on':'')+'"></i>').join('');
  app.innerHTML = '<div class="chap"><div class="chap-art"><img src="'+IMGS.hero+'" alt=""></div>' +
   '<div class="dots">'+dots+'</div>' +
   '<div class="kicker">CHAPTER '+(ci+1)+' / 4</div>' +
   '<h2 class="serif">'+ch.name+'</h2><p>'+ch.intro+'</p>' +
   '<button class="btn btn-main" style="max-width:320px;margin:0 auto" onclick="showQ()">进入这一篇</button>' +
   '<div class="rule"></div></div>';
  window.scrollTo(0,0);
}
function showQ(){
  const qi = S.qi, q = QS[qi], ci = chapterOf(qi);
  const opts = q.opts.map((o,i)=>{
    const sel = S.ans[qi]===i ? ' sel' : '';
    return '<button class="opt'+sel+'" onclick="pick('+i+')"><span class="k">'+'ABCD'[i]+'</span><span>'+o.t+'</span></button>';
  }).join('');
  app.innerHTML =
   '<div class="prog"><span>'+CHAPS[ci].name.split('·')[1].trim()+'</span><div class="bar"><i style="width:'+Math.round((qi+1)/24*100)+'%"></i></div><span>第 '+(qi+1)+' / 24 题</span></div>' +
   '<div class="qcard"><div class="qno">QUESTION '+(qi+1)+'</div><h3 class="serif">'+q.q+'</h3>'+opts+'</div>' +
   (qi>0 ? '<button class="backbtn" onclick="backQ()">← 上一题</button>' : '');
  window.scrollTo(0,0);
}
function pick(i){
  if(S.lock) return;
  S.lock = true;
  S.ans[S.qi] = i;
  const btns = document.querySelectorAll('.opt');
  btns.forEach((b,j)=>{ if(j===i) b.classList.add('sel'); });
  setTimeout(()=>{
    S.lock = false;
    if(S.qi >= 23){ finish(); return; }
    const next = S.qi + 1;
    S.qi = next;
    if(next % 6 === 0) showChapter(chapterOf(next)); else showQ();
  }, 200);
}
function backQ(){ if(S.qi>0){ S.qi--; showQ(); } }

function finish(){
  const r = compute(S.ans);
  S.my = r;
  if(S.invite){
    showDual(S.invite.t, r.top, S.invite.p, r.pct, true);
  } else {
    showResult(r.top, r.pct, r, false);
  }
}

function dimBars(c){
  return c.dims.map((v,i)=>'<div class="dim"><div class="lab"><span>'+DIMNAMES[i]+'</span><b>'+v+'</b></div><div class="tr"><div class="fl" data-w="'+v+'" style="width:0;background:'+c.color+'"></div></div></div>').join('');
}
function showResult(ti, pct, r, fromDual){
  const c = CITIES[ti];
  const top3 = r.order.slice(1,4).map(i=>'<div class="t3"><img src="'+IMGS.cities[i]+'" alt=""><div class="n">'+CITIES[i].name+'</div><div class="s">得分 '+r.scores[i]+'</div></div>').join('');
  const kw = c.keys.map(k=>'<span>'+k+'</span>').join('');
  const rs = c.reasons.map(x=>'<li>'+x+'</li>').join('');
  const lf = c.life.map(x=>'<li>'+x+'</li>').join('');
  const P = CITIES[c.partner];
  app.innerHTML =
   '<div class="res-hero"><img class="ph" src="'+IMGS.cities[ti]+'" alt="">' +
   '<div class="shade"></div><div class="pct">契合度 '+pct+'%</div>' +
   '<div class="inner"><div class="lab">你 的 本 命 定 居 城 市 是</div>' +
   '<h2 class="serif">'+c.name+'</h2><div class="tag">'+c.tagline+'</div></div></div>' +
   '<div class="card"><h4>城市气质</h4><div class="kw">'+kw+'</div></div>' +
   '<div class="card"><h4>四维画像</h4>'+dimBars(c)+'</div>' +
   '<div class="card"><h4>为什么是这座城</h4><ul>'+rs+'</ul></div>' +
   '<div class="card"><h4>气候与节奏</h4><p>'+c.climate+'</p></div>' +
   '<div class="card"><h4>生活成本 · '+c.cost+'</h4><p>'+c.costNote+'</p></div>' +
   '<div class="card"><h4>吃喝玩乐亮点</h4><ul>'+lf+'</ul></div>' +
   '<div class="warn"><b>先说句实话（劝退点）：</b>'+c.downside+'</div>' +
   '<div class="card"><h4>最佳拍档城市</h4><div class="partner"><img src="'+IMGS.cities[c.partner]+'" alt=""><div><div class="pn" style="color:'+P.color+'">'+P.name+'</div><p>'+P.tagline+'。适合一起旅居、互相串门，过两种人生。</p></div></div></div>' +
   '<div class="card"><h4>另外 3 座也很适合你</h4><div class="top3">'+top3+'</div></div>' +
   '<button class="btn btn-main" onclick="openCard(\'single\')">生成我的分享卡</button>' +
   '<button class="btn btn-ghost" onclick="makeInvite()">生成专属链接，邀朋友一起测</button>' +
   '<div id="inviteOut"></div>' +
   (fromDual ? '<button class="btn btn-ghost" onclick="reshowDual()">← 回到双人报告</button>' : '') +
   '<button class="btn btn-ghost" onclick="showHome()">再测一次</button>' +
   '<div class="foot">趣味测试，仅供娱乐和自我探索参考</div>';
  window.scrollTo(0,0);
  setTimeout(()=>{ document.querySelectorAll('.dim .fl').forEach(el=>{ el.style.width = el.dataset.w + '%'; }); }, 80);
}
function makeInvite(){
  const link = SITE + '#i=' + b64e({v:1, t:S.my.top, p:S.my.pct});
  document.getElementById('inviteOut').innerHTML =
   '<div class="linkbox">'+link+'</div>' +
   '<button class="btn btn-main btn-small" onclick="copyText(this,\''+link+'\')">复制链接，发给朋友</button>' +
   '<p style="color:var(--sub);font-size:13px;margin-top:8px;text-align:center">朋友打开链接测完，你俩的同城报告当场出炉</p>';
}
function copyText(btn, text){
  const done = ()=>{ btn.textContent = '已复制 ✓ 去发给朋友吧'; };
  if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(done).catch(()=>fallbackCopy(text, done)); }
  else fallbackCopy(text, done);
}
function fallbackCopy(text, done){
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); done(); }catch(e){ btnHint(text); }
  document.body.removeChild(ta);
}
function btnHint(t){ alert('复制失败，请长按链接手动复制：\n' + t); }

function dualComment(a, b, idx){
  if(a === b) return '同一座城！这不叫巧合，这叫命中注定要做邻居——以后拼火锅、拼周末都有人了。';
  let base;
  if(idx >= 90) base = '气场高度合拍：你俩向往的生活几乎是同一个版本，住在两座城也像同城。';
  else if(idx >= 80) base = '过日子的节奏很合：审美和优先级高度一致，是能一起认真生活的组合。';
  else if(idx >= 70) base = '互补型组合：想要的东西不完全一样，但正好能替对方补上没想到的那部分。';
  else base = '画风不同，但正好互补：一个负责诗和远方，一个负责柴米油盐，谁也别嫌谁。';
  if(CITIES[a].partner === b || CITIES[b].partner === a) base += ' 而且——你俩的本命城市正好是官方认证的「最佳拍档城市」。';
  return base;
}
function showDual(a, b, pa, pb, canReturn){
  const A = CITIES[a], B = CITIES[b];
  const idx = a === b ? 99 : SIM[a][b];
  S.dualCtx = {a:a, b:b, pa:pa, pb:pb, idx:idx};
  let html =
   '<div class="hero" style="padding-top:8px"><div class="kicker">双 人 同 城 报 告</div><h2 class="serif" style="font-size:29px;margin-top:10px">你俩的城市，合不合？</h2></div>' +
   '<div class="dual-vs"><div class="vs">VS</div>' +
   '<div class="side"><img src="'+IMGS.cities[a]+'" alt=""><div class="bd"><div class="n" style="color:'+A.color+'">'+A.name+'</div><div class="r">'+(canReturn?'邀请你的人':'TA')+' · 契合度 '+pa+'%<br>'+A.tagline+'</div></div></div>' +
   '<div class="side"><img src="'+IMGS.cities[b]+'" alt=""><div class="bd"><div class="n" style="color:'+B.color+'">'+B.name+'</div><div class="r">你 · 契合度 '+pb+'%<br>'+B.tagline+'</div></div></div></div>' +
   '<div class="dual-idx"><div class="num">'+idx+'</div><div class="lab">同 城 指 数</div><div class="cmt">'+dualComment(a,b,idx)+'</div></div>' +
   '<button class="btn btn-main" onclick="openCard(\'dual\')">生成双人分享卡</button>';
  if(canReturn){
    const rl = SITE + '#r=' + b64e({v:2, a:a, b:b, pa:pa, pb:pb});
    html += '<div class="linkbox">'+rl+'</div>' +
     '<button class="btn btn-ghost btn-small" onclick="copyText(this,\''+rl+'\')">复制回信链接，发回给 TA</button>' +
     '<button class="btn btn-ghost" onclick="showResult(S.my.top,S.my.pct,S.my,true)">看我自己的完整报告</button>';
  }
  html += '<button class="btn btn-ghost" onclick="showHome()">我也来测一张（新开一局）</button>' +
   '<div class="foot">趣味测试，仅供娱乐和自我探索参考</div>';
  app.innerHTML = html;
  window.scrollTo(0,0);
}
function reshowDual(){ const d = S.dualCtx; if(d) showDual(d.a, d.b, d.pa, d.pb, true); }

/* ---------- 分享卡（纯 canvas 绘制，无外部图片，不会卡死） ---------- */
function rr(ctx,x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function drawCover(ctx, img, x, y, w, h, r){
  if(!img || !img.naturalWidth) return false;
  ctx.save(); rr(ctx,x,y,w,h,r); ctx.clip();
  const s = Math.max(w/img.naturalWidth, h/img.naturalHeight);
  const nw = img.naturalWidth*s, nh = img.naturalHeight*s;
  ctx.drawImage(img, x+(w-nw)/2, y+(h-nh)/2, nw, nh);
  ctx.restore(); return true;
}
function wrap2(ctx, text, maxW){
  const lines = []; let cur = '';
  for(const ch of text){ if(ctx.measureText(cur+ch).width > maxW && cur){ lines.push(cur); cur = ch; } else cur += ch; }
  if(cur) lines.push(cur);
  return lines.slice(0,2);
}
function openCard(mode){
  S.cardMode = mode;
  drawCard();
  document.getElementById('cardModal').style.display = 'flex';
  IMG_EL.cities.forEach(im=>{ if(!im.complete){ im.onload = ()=>{ if(document.getElementById('cardModal').style.display !== 'none') drawCard(); }; } });
}
function closeCard(){ document.getElementById('cardModal').style.display = 'none'; }
function drawCard(){
  const cv = document.getElementById('cardCv'), ctx = cv.getContext('2d');
  const W = 750, H = 1000;
  ctx.fillStyle = '#FBF3E1'; ctx.fillRect(0,0,W,H);
  ctx.textAlign = 'center';
  const site = SITE.replace('https://','').replace('http://','');
  if(S.cardMode === 'dual' && S.dualCtx){
    const d = S.dualCtx, A = CITIES[d.a], B = CITIES[d.b];
    drawCover(ctx, IMG_EL.cities[d.a], 40, 40, 322, 300, 22);
    drawCover(ctx, IMG_EL.cities[d.b], 388, 40, 322, 300, 22);
    ctx.font = '800 46px Georgia, "Songti SC", serif';
    ctx.fillStyle = A.color; ctx.fillText(A.name, 201, 408);
    ctx.fillStyle = B.color; ctx.fillText(B.name, 549, 408);
    ctx.font = '24px sans-serif'; ctx.fillStyle = '#9A8468';
    ctx.fillText(A.tagline, 201, 448); ctx.fillText(B.tagline, 549, 448);
    ctx.fillStyle = '#33291F'; ctx.font = '25px sans-serif';
    ctx.fillText('双 人 同 城 指 数', W/2, 545);
    ctx.fillStyle = '#BC5F1D'; ctx.font = '800 148px sans-serif';
    ctx.fillText(String(d.idx), W/2, 700);
    ctx.fillStyle = '#5C4B40'; ctx.font = '29px sans-serif';
    const cmt = d.a === d.b ? '命中注定，是要做邻居的人' : (d.idx>=85 ? '向往的生活，几乎是同一个版本' : (d.idx>=72 ? '节奏很合，能一起认真生活' : '画风不同，正好互补'));
    ctx.fillText(cmt, W/2, 775);
    ctx.fillStyle = '#9A8468'; ctx.font = '23px sans-serif';
    ctx.fillText('你的本命定居城市 · 双人测试', W/2, 905);
    ctx.fillText(site, W/2, 945);
    return;
  }
  const c = CITIES[S.my.top];
  drawCover(ctx, IMG_EL.cities[S.my.top], 40, 40, 670, 392, 24);
  ctx.fillStyle = '#9A8468'; ctx.font = '24px sans-serif';
  ctx.fillText('我 的 本 命 定 居 城 市', W/2, 500);
  ctx.fillStyle = '#33291F'; ctx.font = '800 80px Georgia, "Songti SC", serif';
  ctx.fillText(c.name, W/2, 592);
  ctx.fillStyle = c.color; ctx.font = 'bold 33px Georgia, "Songti SC", serif';
  ctx.fillText(c.tagline, W/2, 652);
  const pill = '契合度 ' + S.my.pct + '%';
  ctx.font = 'bold 27px sans-serif';
  const pw = ctx.measureText(pill).width + 52;
  ctx.fillStyle = '#BC5F1D'; rr(ctx, (W-pw)/2, 682, pw, 52, 26); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.fillText(pill, W/2, 718);
  ctx.fillStyle = '#5C4B40'; ctx.font = '27px sans-serif';
  ctx.fillText(c.keys.join(' · '), W/2, 792);
  ctx.strokeStyle = '#E3D0A8'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(150,828); ctx.lineTo(W-150,828); ctx.stroke();
  ctx.fillStyle = '#5C4B40'; ctx.font = '26px sans-serif';
  wrap2(ctx, c.reasons[0], 620).forEach((ln,i)=>ctx.fillText(ln, W/2, 878 + i*40));
  ctx.fillStyle = '#9A8468'; ctx.font = '22px sans-serif';
  ctx.fillText('你的本命定居城市 · 24题匹配测试', W/2, 962);
}
function saveCard(){
  const cv = document.getElementById('cardCv');
  const done = url => { const a = document.createElement('a'); a.href = url; a.download = '我的本命定居城市.png'; document.body.appendChild(a); a.click(); a.remove(); };
  if(cv.toBlob){ cv.toBlob(b=>{ if(b){ done(URL.createObjectURL(b)); } else { done(cv.toDataURL('image/png')); } }, 'image/png'); }
  else done(cv.toDataURL('image/png'));
}
function shareCard(){
  const cv = document.getElementById('cardCv');
  const fallback = ()=>saveCard();
  try{
    if(navigator.share && cv.toBlob){
      cv.toBlob(async b=>{
        if(!b){ fallback(); return; }
        const f = new File([b], '我的本命定居城市.png', {type:'image/png'});
        if(navigator.canShare && navigator.canShare({files:[f]})){
          try{ await navigator.share({files:[f], title:'我的本命定居城市'}); }catch(e){}
        } else if(navigator.share){
          try{ await navigator.share({title:'我的本命定居城市', text:'我测出了自己的本命定居城市，你也来测测？', url:SITE}); }catch(e){}
        } else fallback();
      }, 'image/png');
    } else fallback();
  }catch(e){ fallback(); }
}

/* ---------- 入口：解析邀请/回信链接 ---------- */
(function init(){
  const h = location.hash || '';
  try{
    if(h.indexOf('#r=') === 0){
      const p = b64d(h.slice(3));
      if(p && p.v === 2){ S.dualCtx = {a:p.a, b:p.b, pa:p.pa, pb:p.pb, idx: p.a===p.b ? 99 : SIM[p.a][p.b]}; showDual(p.a, p.b, p.pa, p.pb, false); return; }
    } else if(h.indexOf('#i=') === 0){
      const p = b64d(h.slice(3));
      if(p && p.v === 1) S.invite = {t:p.t, p:p.p};
    }
  }catch(e){ S.invite = null; }
  showHome();
})();
</script>
